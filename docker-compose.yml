services:
  db:
    image: postgres:16-alpine
    container_name: konyaev-java-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-konyaev}
      POSTGRES_USER: ${POSTGRES_USER:-konyaev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konyaev_pass}
    volumes:
      - konyaev-java-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konyaev} -d ${POSTGRES_DB:-konyaev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: konyaev-java-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-konyaev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-konyaev}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-konyaev_pass}
      SECRET_KEY: ${SECRET_KEY:-default_secure_secret_key_for_jwt_token_auth_32_bytes_min}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"

volumes:
  konyaev-java-db-data:
