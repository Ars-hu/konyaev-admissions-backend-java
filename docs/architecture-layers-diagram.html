<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Схема взаимодействия слоёв и пакетов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 900px;
    background: #0f131a;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e2e8f0;
    overflow: hidden;
  }
</style>
</head>
<body>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Заголовок схемы -->
  <text x="600" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    Взаимодействие архитектурных слоёв и пакетов проекта
  </text>
  <text x="600" y="70" text-anchor="middle" font-size="13.5" fill="#94a3b8">
    Классическая 3-слойная архитектура: Web (Controller) ➔ Service ➔ Repository ➔ База данных (Entity)
  </text>

  <!-- ═══════════ ЛЕВАЯ КОЛОНКА: ВНЕШНИЙ МИР И БЕЗОПАСНОСТЬ ═══════════ -->
  <!-- 1. Клиентский слой -->
  <rect x="50" y="110" width="280" height="120" rx="10" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="65" y="125" width="80" height="24" rx="5" fill="#0284c7"/>
  <text x="105" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">КЛИЕНТ</text>
  <text x="155" y="142" font-size="15" font-weight="700" fill="#f8fafc">HTTP Клиенты</text>
  <text x="65" y="172" font-size="12.5" fill="#94a3b8">• React фронтенд / test index.html</text>
  <text x="65" y="192" font-size="12.5" fill="#94a3b8">• Swagger UI (/swagger-ui.html)</text>
  <text x="65" y="212" font-size="12.5" fill="#94a3b8">• Postman / мобильные браузеры</text>

  <!-- 2. Слой безопасности (SECURITY) -->
  <rect x="50" y="290" width="280" height="175" rx="10" fill="url(#blueCard)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="65" y="305" width="90" height="24" rx="5" fill="#d97706"/>
  <text x="110" y="321" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">SECURITY</text>
  <text x="165" y="322" font-size="15" font-weight="700" fill="#f8fafc">Пакет security</text>
  <text x="65" y="352" font-size="12.5" fill="#e2e8f0" font-weight="600">JwtAuthenticationFilter</text>
  <text x="65" y="370" font-size="12" fill="#94a3b8">Перехватывает заголовок Authorization</text>
  <text x="65" y="396" font-size="12.5" fill="#e2e8f0" font-weight="600">JwtTokenProvider</text>
  <text x="65" y="414" font-size="12" fill="#94a3b8">HMAC-SHA256 подпись, валидация 24 ч</text>
  <text x="65" y="442" font-size="12" fill="#fbbf24">→ Наполняет SecurityContextHolder</text>

  <!-- 3. Слой конфигурации (CONFIG) -->
  <rect x="50" y="525" width="280" height="205" rx="10" fill="url(#blueCard)" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="65" y="540" width="80" height="24" rx="5" fill="#7c3aed"/>
  <text x="105" y="556" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">CONFIG</text>
  <text x="155" y="557" font-size="15" font-weight="700" fill="#f8fafc">Пакет config</text>
  <text x="65" y="586" font-size="12.5" fill="#e2e8f0" font-weight="600">SecurityConfig</text>
  <text x="65" y="604" font-size="12" fill="#94a3b8">Stateless, BCrypt, открытые URL</text>
  <text x="65" y="630" font-size="12.5" fill="#e2e8f0" font-weight="600">DataInitializer (CommandLineRunner)</text>
  <text x="65" y="648" font-size="12" fill="#94a3b8">Сидинг админа, летних месяцев (6,7,8)</text>
  <text x="65" y="674" font-size="12.5" fill="#e2e8f0" font-weight="600">ApplicationConfig</text>
  <text x="65" y="692" font-size="12" fill="#94a3b8">37 слотов (09:00–15:00), Europe/Moscow</text>
  <text x="65" y="714" font-size="12" fill="#c084fc">Квота по умолчанию: 3 чел/слот</text>

  <!-- ═══════════ ЦЕНТРАЛЬНАЯ КОЛОНКА: ОСНОВНОЙ 3-СЛОЙНЫЙ PIPELINE ═══════════ -->

  <!-- СЛОЙ 1: CONTROLLER -->
  <rect x="420" y="110" width="370" height="165" rx="10" fill="url(#blueCard)" stroke="#06b6d4" stroke-width="1.8"/>
  <rect x="435" y="125" width="115" height="24" rx="5" fill="#0891b2"/>
  <text x="492" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1. CONTROLLER</text>
  <text x="560" y="142" font-size="15" font-weight="700" fill="#f8fafc">Веб-контроллеры</text>
  <text x="435" y="172" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">PublicController</tspan> (4 открытых метода для абитуриентов)</text>
  <text x="435" y="192" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">AdminController</tspan> (16 защищённых методов, ROLE_ADMIN)</text>
  <text x="435" y="212" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">AuthController</tspan> (вход по логину/паролю, выдача JWT)</text>
  <text x="435" y="232" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">GlobalExceptionHandler</tspan> (гарантия 0 ошибок 500)</text>
  <text x="435" y="258" font-size="11.5" fill="#38bdf8">Принимает HTTP, проверяет @Valid DTO, возвращает JSON 200/201/400</text>

  <!-- СЛОЙ 2: SERVICE -->
  <rect x="420" y="340" width="370" height="175" rx="10" fill="url(#blueCard)" stroke="#10b981" stroke-width="1.8"/>
  <rect x="435" y="355" width="95" height="24" rx="5" fill="#059669"/>
  <text x="482" y="371" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2. SERVICE</text>
  <text x="540" y="372" font-size="15" font-weight="700" fill="#f8fafc">Бизнес-логика</text>
  <text x="435" y="402" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">ApplicationService</tspan> (валидация 24ч, дубликатов, квот слота)</text>
  <text x="435" y="422" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">CalendarService</tspan> (статусы дней, открытые месяцы, слоты)</text>
  <text x="435" y="442" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">ArchiveService</tspan> (@Scheduled авто-архивация раз в 5 мин)</text>
  <text x="435" y="462" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">ExportService</tspan> (генерация файлов Excel .xlsx в Apache POI)</text>
  <text x="435" y="482" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">SettingsService</tspan> (динамический буфер advance_hours)</text>
  <text x="435" y="504" font-size="12" fill="#34d399">Управляет @Transactional транзакциями, циклами for/if и проверками</text>

  <!-- СЛОЙ 3: REPOSITORY -->
  <rect x="420" y="590" width="370" height="155" rx="10" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="435" y="605" width="115" height="24" rx="5" fill="#2563eb"/>
  <text x="492" y="621" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3. REPOSITORY</text>
  <text x="560" y="622" font-size="15" font-weight="700" fill="#f8fafc">Доступ к данным</text>
  <text x="435" y="652" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">9 интерфейсов Spring Data JPA</tspan> (extends JpaRepository)</text>
  <text x="435" y="672" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">JPQL-запросы @Query</tspan> (поиск без учета регистра, поиск дублей)</text>
  <text x="435" y="692" font-size="12.5" fill="#e2e8f0">• <tspan font-weight="600">Производные методы</tspan> (countByDateAndTime, existsBy...)</text>
  <text x="435" y="724" font-size="11.5" fill="#60a5fa">Автоматическая генерация SQL-запросов прокси-классами Spring Data</text>

  <!-- ═══════════ ПРАВАЯ КОЛОНКА: ДАННЫЕ (DTO, ENTITY, БАЗА) ═══════════ -->

  <!-- DTO (Data Transfer Object) -->
  <rect x="870" y="110" width="280" height="155" rx="10" fill="url(#blueCard)" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="885" y="125" width="60" height="24" rx="5" fill="#0891b2"/>
  <text x="915" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DTO</text>
  <text x="955" y="142" font-size="15" font-weight="700" fill="#f8fafc">Пакет dto</text>
  <text x="885" y="172" font-size="12.5" fill="#e2e8f0" font-weight="600">RegisterRequest</text>
  <text x="885" y="188" font-size="11.5" fill="#94a3b8">@NotBlank, @Size, @Email (валидация)</text>
  <text x="885" y="210" font-size="12.5" fill="#e2e8f0" font-weight="600">LoginRequest</text>
  <text x="885" y="226" font-size="11.5" fill="#94a3b8">username + password админа</text>
  <text x="885" y="248" font-size="12.5" fill="#e2e8f0" font-weight="600">ErrorResponse</text>
  <text x="885" y="262" font-size="11.5" fill="#94a3b8">Формат ошибок (status, error, time)</text>

  <!-- ENTITY (JPA Сущности) -->
  <rect x="870" y="380" width="280" height="225" rx="10" fill="url(#blueCard)" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="885" y="395" width="70" height="24" rx="5" fill="#db2777"/>
  <text x="920" y="411" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">ENTITY</text>
  <text x="965" y="412" font-size="15" font-weight="700" fill="#f8fafc">Пакет entity</text>
  <text x="885" y="440" font-size="12" fill="#e2e8f0">• <tspan font-weight="600">Application</tspan> (активные заявки)</text>
  <text x="885" y="460" font-size="12" fill="#e2e8f0">• <tspan font-weight="600">ArchivedApplication</tspan> (архив заявок)</text>
  <text x="885" y="480" font-size="12" fill="#e2e8f0">• <tspan font-weight="600">User</tspan> (аккаунты admin, BCrypt-хеш)</text>
  <text x="885" y="500" font-size="12" fill="#e2e8f0">• <tspan font-weight="600">SlotConfig</tspan> (лимит и блок времени)</text>
  <text x="885" y="520" font-size="12" fill="#e2e8f0">• <tspan font-weight="600">BlockedDate</tspan> / <tspan font-weight="600">OpenedDate</tspan></text>
  <text x="885" y="540" font-size="12" fill="#e2e8f0">• <tspan font-weight="600">AllowedMonth</tspan> / <tspan font-weight="600">DailyLimit</tspan></text>
  <text x="885" y="560" font-size="12" fill="#e2e8f0">• <tspan font-weight="600">SiteSetting</tspan> (advance_hours=24)</text>
  <text x="885" y="590" font-size="11.5" fill="#f472b6">Явные геттеры/сеттеры без магии Lombok</text>

  <!-- БАЗА ДАННЫХ (PostgreSQL 16) -->
  <rect x="870" y="660" width="280" height="150" rx="10" fill="url(#blueCard)" stroke="#6366f1" stroke-width="2"/>
  <rect x="885" y="675" width="105" height="24" rx="5" fill="#4f46e5"/>
  <text x="937" y="691" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DATABASE</text>
  <text x="1000" y="692" font-size="15" font-weight="700" fill="#f8fafc">PostgreSQL 16</text>
  <text x="885" y="722" font-size="12" fill="#e2e8f0">• 9 таблиц (schema.sql)</text>
  <text x="885" y="742" font-size="12" fill="#e2e8f0">• Индексы (idx_app_reg_date, phone, email)</text>
  <text x="885" y="762" font-size="12" fill="#e2e8f0">• Пул соединений HikariCP</text>
  <text x="885" y="792" font-size="12" fill="#818cf8">Хранение данных в постоянном volume</text>

  <!-- ═══════════ СОЕДИНИТЕЛЬНЫЕ СТРЕЛКИ И ПОДПИСИ ═══════════ -->

  <!-- Клиент -> Security -->
  <line x1="190" y1="230" x2="190" y2="282" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="198" y="264" font-size="11" fill="#fbbf24">HTTP заголовок</text>

  <!-- Security -> Controller -->
  <path d="M 330 360 L 375 360 L 375 190 L 412 190" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="345" y="275" font-size="11" fill="#fbbf24" transform="rotate(-90 345,275)">Авторизован (JWT)</text>

  <!-- Прямой публичный запрос Клиент -> Controller (без токена) -->
  <path d="M 330 150 L 412 150" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="340" y="142" font-size="11" fill="#38bdf8">Публичный JSON</text>

  <!-- Controller <-> DTO -->
  <line x1="790" y1="165" x2="862" y2="165" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="800" y="157" font-size="11" fill="#06b6d4">@Valid DTO</text>

  <!-- Controller -> Service -->
  <line x1="605" y1="265" x2="605" y2="332" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
  <text x="615" y="304" font-size="12" font-weight="600" fill="#34d399">Вызов сервиса (DTO)</text>

  <!-- Service -> Repository -->
  <line x1="605" y1="515" x2="605" y2="582" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <text x="615" y="554" font-size="12" font-weight="600" fill="#60a5fa">Запрос к репозиторию</text>

  <!-- Service <-> Entity -->
  <path d="M 790 440 L 862 440" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="796" y="432" font-size="11" fill="#f472b6">Entity-объекты</text>

  <!-- Repository <-> Entity -->
  <path d="M 790 640 L 830 640 L 830 520 L 862 520" fill="none" stroke="#ec4899" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="800" y="585" font-size="11" fill="#f472b6" transform="rotate(-90 800,585)">Маппинг JPA</text>

  <!-- Repository -> PostgreSQL Database -->
  <line x1="790" y1="710" x2="862" y2="710" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="800" y="702" font-size="11.5" font-weight="600" fill="#818cf8">SQL (JDBC)</text>

  <!-- Config -> Service / Repository / Security (пунктирные линии инициализации) -->
  <path d="M 330 610 L 375 610 L 375 480 L 412 480" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-purple)"/>
  <text x="345" y="540" font-size="11" fill="#c084fc" transform="rotate(-90 345,540)">Инициализация</text>

  <!-- Подвал схемы: пояснение принципа изоляции -->
  <rect x="50" y="760" width="740" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="70" y="782" font-size="12" font-weight="700" fill="#f8fafc">Золотое правило 3-х слойной архитектуры:</text>
  <text x="70" y="799" font-size="11.5" fill="#94a3b8">
    Зависимости идут строго сверху вниз (Controller ➔ Service ➔ Repository ➔ Entity). Service НИКОГДА не знает о Controller.
  </text>
</svg>
</body>
</html>
