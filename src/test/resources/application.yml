server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=YEAR,MONTH,KEY
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: test_secure_secret_key_for_testing_purposes_at_least_32_bytes
    expiration-ms: 86400000
  admin:
    username: admin
    password: admin123
