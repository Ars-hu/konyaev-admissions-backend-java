server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: admissions-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/konyaev}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:konyaev}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:konyaev_pass}}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Europe/Moscow

# Безопасность и параметры приложения (все секреты переопределяются через переменные окружения)
app:
  jwt:
    secret: ${SECRET_KEY:default_secure_secret_key_for_jwt_token_auth_32_bytes_min}
    expiration-ms: 86400000 # 24 часа
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  timezone: Europe/Moscow

# Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    validator-url: none
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
